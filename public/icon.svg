<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Geometric Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Open Academic Book -->
  <g transform="translate(256, 276)">
    <!-- Book Spine Glow -->
    <path d="M-150 40 C-80 65, -20 60, 0 85 C20 60, 80 65, 150 40 L150 -70 C80 -45, 20 -50, 0 -25 C-20 -50, -80 -45, -150 -70 Z" 
          fill="#000000" opacity="0.3" filter="url(#subtleGlow)" />

    <!-- Left Page Base -->
    <path d="M-144 30 C-75 55, -18 52, 0 75 L0 -35 C-18 -58, -75 -55, -144 -80 Z" 
          fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Right Page Base -->
    <path d="M144 30 C75 55, 18 52, 0 75 L0 -35 C18 -58, 75 -55, 144 -80 Z" 
          fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Notebook Ruled Lines (Right Page - Solved Steps) -->
    <path d="M30 -15 C60 -30, 95 -28, 120 -40" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M30 10 C60 -5, 95 -3, 120 -15" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M30 35 C60 20, 95 22, 120 10" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Notebook Ruled Lines (Left Page - Handwritten Notes) -->
    <path d="M-30 -15 C-60 -30, -95 -28, -120 -40" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8" />
    <path d="M-30 10 C-60 -5, -95 -3, -120 -15" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8" />
    <path d="M-30 35 C-60 20, -95 22, -120 10" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8" />

    <!-- Center Spine Line -->
    <line x1="0" y1="-35" x2="0" y2="75" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Golden Smart Quill / Digital Stylus -->
  <g transform="translate(256, 175)">
    <!-- Stylus Body -->
    <path d="M-6 -60 L6 -60 L14 15 L0 42 L-14 15 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    <!-- Nib Tip -->
    <polygon points="0,48 -5,35 5,35" fill="#fef08a" />
    <!-- Center Nib Slit -->
    <line x1="0" y1="35" x2="0" y2="44" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <!-- Pen Collar Ring -->
    <rect x="-8" y="-30" width="16" height="5" rx="1.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Verified Solution Checkmark Badge -->
  <g transform="translate(365, 345)">
    <!-- Badge Background Circle -->
    <circle cx="0" cy="0" r="38" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4" filter="url(#subtleGlow)" />
    <!-- White Checkmark -->
    <path d="M-14 0 L-4 10 L15 -10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Academic Radiance Rays at Top -->
  <g transform="translate(256, 95)" opacity="0.85">
    <circle cx="0" cy="0" r="4" fill="#fbbf24" />
    <circle cx="-32" cy="8" r="3" fill="#fbbf24" />
    <circle cx="32" cy="8" r="3" fill="#fbbf24" />
    <circle cx="-60" cy="22" r="2.5" fill="#fbbf24" />
    <circle cx="60" cy="22" r="2.5" fill="#fbbf24" />
  </g>
</svg>
